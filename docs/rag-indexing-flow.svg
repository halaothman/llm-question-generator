<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="380" viewBox="0 0 2100 380">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <style>
      .box { fill: #E8F4FC; stroke: #2563eb; stroke-width: 2; rx: 12; }
      .title { font: bold 20px 'Segoe UI', Arial, sans-serif; fill: #1e3a8a; text-anchor: middle; }
      .sub { font: 16px 'Segoe UI', Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .arrow { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .caption { font: 14px 'Segoe UI', Arial, sans-serif; fill: #64748b; text-anchor: middle; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <rect class="box" x="30" y="70" width="280" height="180"/>
  <text class="title" x="170" y="115">1. Documents</text>
  <text class="sub" x="170" y="150">PDF, DOCX, TXT, MD</text>
  <line class="arrow" x1="310" y1="160" x2="350" y2="160"/>

  <rect class="box" x="350" y="70" width="280" height="180"/>
  <text class="title" x="490" y="115">2. Text extraction</text>
  <text class="sub" x="490" y="150">loaders.py</text>
  <line class="arrow" x1="630" y1="160" x2="670" y2="160"/>

  <rect class="box" x="670" y="55" width="300" height="210"/>
  <text class="title" x="820" y="105">3. Arabic preprocessing</text>
  <text class="sub" x="820" y="140">clean_ar + stem_ar</text>
  <text class="sub" x="820" y="168">(indexing only)</text>
  <line class="arrow" x1="970" y1="160" x2="1010" y2="160"/>

  <rect class="box" x="1010" y="70" width="260" height="180"/>
  <text class="title" x="1140" y="115">4. Chunking</text>
  <text class="sub" x="1140" y="150">500 chars / 100 overlap</text>
  <line class="arrow" x1="1270" y1="160" x2="1310" y2="160"/>

  <rect class="box" x="1310" y="55" width="340" height="210"/>
  <text class="title" x="1480" y="105">5. Embeddings</text>
  <text class="sub" x="1480" y="140">e5-large-v2 or AraBERTv2</text>
  <line class="arrow" x1="1650" y1="160" x2="1690" y2="160"/>

  <rect class="box" x="1690" y="55" width="340" height="210"/>
  <text class="title" x="1860" y="105">6. FAISS + JSONL</text>
  <text class="sub" x="1860" y="140">baseline / improved</text>

  <text class="caption" x="1050" y="330">RAG reference indexing pipeline</text>
</svg>
